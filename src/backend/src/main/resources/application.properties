# Configuración del Servidor
# El hosting (Render/Railway) inyecta la variable PORT; en local usa 8080.
server.port=${PORT:8080}

# Conexión a Base de Datos PostgreSQL
# En local toma los valores por defecto (localhost). En producción se
# sobreescriben con variables de entorno apuntando a Supabase.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/emplanorte}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Tomioka05}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate
# Usamos 'none' para respetar al 100% el script SQL estructurado en 01_schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Jackson para serialización JSON limpia
spring.jackson.serialization.write-dates-as-timestamps=false
